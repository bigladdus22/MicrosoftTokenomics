name: Deploy Supabase

# Applies new database migrations whenever supabase/migrations changes on main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   — project database password (Project Settings → Database)
#   SUPABASE_PROJECT_ID    — optional; defaults to uixmmjcuhnzwuqhawmwn (not a secret)
#
# Supabase's GitHub integration (Project Settings → Integrations) may also apply
# migrations on merge. `supabase db push` is a no-op for versions already applied,
# so running both is safe.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'uixmmjcuhnzwuqhawmwn' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
